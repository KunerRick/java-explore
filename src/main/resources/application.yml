server:
  port: 8081
  servlet:
    context-path: /async-task

spring:
  application:
    name: async-task-framework
  
  # MySQL数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ewqazxck
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: AsyncTaskHikariPool
      
  # MyBatis配置
  mybatis:
    config-location: classpath:mybatis-config.xml
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.example.asynctask.entity
    configuration:
      map-underscore-to-camel-case: true
      cache-enabled: true
      lazy-loading-enabled: true
      default-statement-timeout: 30
      default-fetch-size: 100
      use-actual-param-name: true
        
  # Thymeleaf配置
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html

# 异步任务配置
async-task:
  # 线程池配置
  thread-pool:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 100
    keep-alive-seconds: 60
    thread-name-prefix: AsyncTask-
    
  # 调度器配置
  scheduler:
    enabled: true
    poll-interval: 5000  # 轮询间隔(毫秒)
    batch-size: 10       # 每次处理的任务数量
    
  # 重试配置
  retry:
    max-attempts: 3
    initial-delay: 1000
    multiplier: 2.0
    
# 日志配置
logging:
  level:
    com.example.asynctask: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/async-task.log
    max-size: 10MB
    max-history: 30