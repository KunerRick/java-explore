<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异步任务框架</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .stats-card {
            transition: all 0.3s;
        }
        .stats-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .stats-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 1.5rem;
            color: white;
        }
        .nav-link {
            border-radius: 10px;
        }
        .nav-link.active {
            background-color: #0d6efd !important;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-gear-fill me-2"></i>异步任务框架
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" th:href="@{/}">首页</a>
                <a class="nav-link" th:href="@{/tasks}">任务列表</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>任务管理概览</h2>
                    <div>
                        <button id="refreshBtn" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-clockwise me-1"></i>刷新数据
                        </button>
                        <button id="createMockBtn" class="btn btn-outline-warning ms-2" onclick="createMockTasks()">
                            <i class="bi bi-magic me-1"></i>Mock数据
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="stats-icon bg-primary me-3">
                            <i class="bi bi-list-task"></i>
                        </div>
                        <div>
                            <h6 class="card-subtitle mb-1">总任务数</h6>
                            <h4 class="card-title mb-0" id="totalTasks">-</h4>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="stats-icon bg-warning me-3">
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                        <div>
                            <h6 class="card-subtitle mb-1">待处理</h6>
                            <h4 class="card-title mb-0" id="pendingTasks">-</h4>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="stats-icon bg-info me-3">
                            <i class="bi bi-arrow-repeat"></i>
                        </div>
                        <div>
                            <h6 class="card-subtitle mb-1">处理中</h6>
                            <h4 class="card-title mb-0" id="processingTasks">-</h4>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="stats-icon bg-success me-3">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div>
                            <h6 class="card-subtitle mb-1">已完成</h6>
                            <h4 class="card-title mb-0" id="completedTasks">-</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">快速操作</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button id="createVideoScoringTaskBtn" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                                <i class="bi bi-plus-circle me-1"></i>创建视频评分任务
                            </button>
                            <button id="scheduleTasksBtn" class="btn btn-outline-primary">
                                <i class="bi bi-play-circle me-1"></i>手动调度任务
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">调度器状态</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span>状态:</span>
                            <span id="schedulerStatus" class="badge bg-secondary">未知</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span>总调度次数:</span>
                            <span id="totalSchedules">-</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span>成功任务数:</span>
                            <span id="successTasks">-</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span>失败任务数:</span>
                            <span id="failedTasks">-</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button id="startSchedulerBtn" class="btn btn-success flex-fill">启动</button>
                            <button id="stopSchedulerBtn" class="btn btn-danger flex-fill">停止</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">最近任务</h5>
                        <a th:href="@{/tasks}" class="btn btn-sm btn-outline-primary">查看全部</a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>任务ID</th>
                                        <th>任务名称</th>
                                        <th>任务类型</th>
                                        <th>状态</th>
                                        <th>进度</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="recentTasksTable">
                                    <tr>
                                        <td colspan="7" class="text-center">正在加载...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建任务模态框 -->
    <div class="modal fade" id="createTaskModal" tabindex="-1" aria-labelledby="createTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createTaskModalLabel">创建视频评分任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createTaskForm">
                        <div class="mb-3">
                            <label for="videoId" class="form-label">视频ID</label>
                            <input type="text" class="form-control" id="videoId" required>
                            <div class="form-text">请输入要评分的视频ID</div>
                        </div>
                        <div class="mb-3">
                            <label for="taskName" class="form-label">任务名称</label>
                            <input type="text" class="form-control" id="taskName" required>
                        </div>
                        <div class="mb-3">
                            <label for="creator" class="form-label">创建人</label>
                            <input type="text" class="form-control" id="creator" required>
                        </div>
                        <div class="mb-3">
                            <label for="priority" class="form-label">优先级 (1-10)</label>
                            <input type="number" class="form-control" id="priority" min="1" max="10" value="5" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="submitCreateTask">创建任务</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/index.js}"></script>
</body>
</html>
