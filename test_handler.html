<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>异步任务管理器测试</title>
    <script>
        // 创建任务
        function createTask() {
            var taskId = document.getElementById('taskId').value;
            if (!taskId) {
                alert('请输入任务ID');
                return;
            }
            
            fetch('/api/test/create/' + taskId)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').textContent = 'Error: ' + error;
                });
        }
        
        // 执行任务
        function executeTask() {
            var taskId = document.getElementById('taskId').value;
            if (!taskId) {
                alert('请输入任务ID');
                return;
            }
            
            fetch('/api/test/execute/' + taskId)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').textContent = 'Error: ' + error;
                });
        }
        
        // 查看任务状态
        function checkStatus() {
            var taskId = document.getElementById('taskId').value;
            if (!taskId) {
                alert('请输入任务ID');
                return;
            }
            
            fetch('/api/test/status/' + taskId)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').textContent = 'Error: ' + error;
                });
        }
        
        // 自动刷新任务状态
        var refreshInterval;
        function startAutoRefresh() {
            var taskId = document.getElementById('taskId').value;
            if (!taskId) {
                alert('请输入任务ID');
                return;
            }
            
            refreshInterval = setInterval(() => {
                checkStatus();
            }, 3000);
            document.getElementById('refreshStatus').textContent = '停止自动刷新';
        }
        
        function stopAutoRefresh() {
            clearInterval(refreshInterval);
            document.getElementById('refreshStatus').textContent = '开始自动刷新';
        }
        
        function toggleRefresh() {
            if (refreshInterval) {
                stopAutoRefresh();
            } else {
                startAutoRefresh();
            }
        }
    </script>
</head>
<body>
    <h1>异步任务管理器测试</h1>
    
    <div>
        <label for="taskId">任务ID:</label>
        <input type="text" id="taskId" value="1001">
    </div>
    
    <div style="margin-top: 10px;">
        <button onclick="createTask()">创建任务</button>
        <button onclick="executeTask()">执行任务</button>
        <button onclick="checkStatus()">查看状态</button>
        <button id="refreshStatus" onclick="toggleRefresh()">开始自动刷新</button>
    </div>
    
    <div style="margin-top: 20px;">
        <h3>结果:</h3>
        <pre id="result" style="background-color: #f0f0f0; padding: 10px; border: 1px solid #ccc;"></pre>
    </div>
</body>
</html>
