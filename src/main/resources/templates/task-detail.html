<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情 - 异步任务框架</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .nav-link {
            border-radius: 10px;
        }
        .nav-link.active {
            background-color: #0d6efd !important;
            border-radius: 10px;
        }
        .status-badge {
            font-size: 0.85em;
            padding: 0.35em 0.65em;
        }
        .step-item {
            border-left: 3px solid #dee2e6;
            padding-left: 1rem;
            margin-bottom: 1rem;
        }
        .step-item.completed {
            border-left-color: #198754;
        }
        .step-item.failed {
            border-left-color: #dc3545;
        }
        .step-item.processing {
            border-left-color: #0dcaf0;
        }
        .log-item {
            border-left: 3px solid #6c757d;
            padding-left: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        .log-item.info {
            border-left-color: #0dcaf0;
        }
        .log-item.warn {
            border-left-color: #ffc107;
        }
        .log-item.error {
            border-left-color: #dc3545;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-gear-fill me-2"></i>异步任务框架
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">首页</a>
                <a class="nav-link" th:href="@{/tasks}">任务列表</a>
                <a class="nav-link active" href="#">任务详情</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>任务详情</h2>
                    <div>
                        <button id="refreshBtn" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-clockwise me-1"></i>刷新
                        </button>
                        <button id="backBtn" class="btn btn-secondary ms-2" onclick="window.history.back()">
                            <i class="bi bi-arrow-left me-1"></i>返回
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8 mb-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">基本信息</h5>
                        <span id="taskStatusBadge" class="badge bg-secondary status-badge">-</span>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">任务ID</label>
                                <p class="form-control-plaintext" id="taskId">-</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">任务名称</label>
                                <p class="form-control-plaintext" id="taskName">-</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">任务类型</label>
                                <p class="form-control-plaintext" id="taskType">-</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">创建人</label>
                                <p class="form-control-plaintext" id="creator">-</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">优先级</label>
                                <p class="form-control-plaintext" id="priority">-</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">进度</label>
                                <div class="progress" style="height: 25px;">
                                    <div class="progress-bar" role="progressbar" id="progressBar" 
                                         style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                        <span id="progressText">0%</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">创建时间</label>
                                <p class="form-control-plaintext" id="createdTime">-</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">更新时间</label>
                                <p class="form-control-plaintext" id="updatedTime">-</p>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label fw-bold">任务参数</label>
                                <pre class="bg-light p-3 rounded" id="parameters">-</pre>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label fw-bold">任务结果</label>
                                <pre class="bg-light p-3 rounded" id="result">-</pre>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">执行步骤</h5>
                    </div>
                    <div class="card-body">
                        <div id="taskSteps">
                            <p class="text-center text-muted">正在加载执行步骤...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">操作面板</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2" id="actionButtons">
                            <p class="text-center text-muted">正在加载操作按钮...</p>
                        </div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">执行日志</h5>
                    </div>
                    <div class="card-body">
                        <div id="taskLogs" style="max-height: 400px; overflow-y: auto;">
                            <p class="text-center text-muted">正在加载执行日志...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 获取上下文路径
        function getContextPath() {
            return window.location.pathname.substring(0, window.location.pathname.indexOf("/",2));
        }
        
        let taskId = null;
        let refreshInterval = null;

        document.addEventListener('DOMContentLoaded', function() {
            // 获取URL中的任务ID
            const urlParams = new URLSearchParams(window.location.search);
            taskId = urlParams.get('taskId');
            
            if (!taskId) {
                showToast('缺少任务ID参数', 'danger');
                return;
            }

            loadTaskDetail();

            // 刷新按钮
            document.getElementById('refreshBtn').addEventListener('click', function() {
                loadTaskDetail();
            });

            // 自动刷新（针对处理中的任务）
            startAutoRefresh();
        });

        function loadTaskDetail() {
            fetch(getContextPath() + `/api/tasks/${taskId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        updateTaskDetail(data.data);
                    } else {
                        showToast('加载任务详情失败: ' + data.message, 'danger');
                    }
                })
                .catch(error => {
                    console.error('Error loading task detail:', error);
                    showToast('加载任务详情异常', 'danger');
                });
        }

        function updateTaskDetail(task) {
            // 更新基本信息
            document.getElementById('taskId').textContent = task.taskId || '-';
            document.getElementById('taskName').textContent = task.taskName || '-';
            document.getElementById('taskType').textContent = task.taskType || '-';
            document.getElementById('creator').textContent = task.creator || '-';
            document.getElementById('priority').textContent = task.priority || '-';
            document.getElementById('createdTime').textContent = formatDateTime(task.createdTime) || '-';
            document.getElementById('updatedTime').textContent = formatDateTime(task.updatedTime) || '-';
            
            // 更新参数和结果
            document.getElementById('parameters').textContent = task.parameters ? 
                JSON.stringify(task.parameters, null, 2) : '-';
            document.getElementById('result').textContent = task.result ? 
                JSON.stringify(task.result, null, 2) : '-';
            
            // 更新进度条
            const progress = task.progress || 0;
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressBar.style.width = progress + '%';
            progressText.textContent = progress + '%';
            
            // 更新状态徽章
            updateStatusBadge(task.status);
            
            // 更新操作按钮
            updateActionButtons(task);
            
            // 更新执行步骤
            updateTaskSteps(task);
            
            // 更新执行日志
            updateTaskLogs(task);
            
            // 根据任务状态调整自动刷新
            adjustAutoRefresh(task.status);
        }

        function updateStatusBadge(status) {
            const statusConfig = {
                'PENDING': { text: '待处理', class: 'bg-warning' },
                'PROCESSING': { text: '处理中', class: 'bg-info' },
                'COMPLETED': { text: '已完成', class: 'bg-success' },
                'FAILED': { text: '失败', class: 'bg-danger' },
                'PAUSED': { text: '暂停', class: 'bg-secondary' }
            };
            
            const config = statusConfig[status] || { text: status, class: 'bg-secondary' };
            const badge = document.getElementById('taskStatusBadge');
            badge.textContent = config.text;
            badge.className = `badge ${config.class} status-badge`;
        }

        function updateActionButtons(task) {
            const actionButtons = document.getElementById('actionButtons');
            let buttons = '';
            
            if (task.status === 'PENDING') {
                buttons += `<button class="btn btn-success" onclick="executeTask('${task.taskId}')">
                    <i class="bi bi-play-fill me-1"></i>执行任务
                </button>`;
            }
            
            if (task.status === 'FAILED') {
                buttons += `<button class="btn btn-warning" onclick="retryTask('${task.taskId}')">
                    <i class="bi bi-arrow-clockwise me-1"></i>重试任务
                </button>`;
            }
            
            if (task.status === 'PROCESSING') {
                buttons += `<button class="btn btn-warning" onclick="pauseTask('${task.taskId}')">
                    <i class="bi bi-pause-fill me-1"></i>暂停任务
                </button>`;
            }
            
            if (task.status === 'PROCESSING' || task.status === 'PENDING') {
                buttons += `<button class="btn btn-danger" onclick="cancelTask('${task.taskId}')">
                    <i class="bi bi-x-circle me-1"></i>取消任务
                </button>`;
            }
            
            if (task.status === 'PAUSED') {
                buttons += `<button class="btn btn-success" onclick="resumeTask('${task.taskId}')">
                    <i class="bi bi-play-fill me-1"></i>恢复任务
                </button>`;
            }
            
            // 删除任务按钮（谨慎使用）
            buttons += `<button class="btn btn-outline-danger" onclick="deleteTask('${task.taskId}')">
                <i class="bi bi-trash me-1"></i>删除任务
            </button>`;
            
            actionButtons.innerHTML = buttons;
        }

        function updateTaskSteps(task) {
            const taskSteps = document.getElementById('taskSteps');
            
            // 这里应该根据实际的任务步骤数据来渲染
            // 暂时使用示例数据
            const steps = [
                { name: '步骤1: 初始化', status: 'COMPLETED', time: task.createdTime },
                { name: '步骤2: 处理中', status: task.status === 'PROCESSING' ? 'PROCESSING' : 'PENDING', time: null },
                { name: '步骤3: 完成', status: task.status === 'COMPLETED' ? 'COMPLETED' : 'PENDING', time: task.updatedTime }
            ];
            
            taskSteps.innerHTML = steps.map(step => `
                <div class="step-item ${step.status.toLowerCase()}">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold">${step.name}</span>
                        <span class="badge ${getStepStatusBadgeClass(step.status)}">${getStepStatusText(step.status)}</span>
                    </div>
                    ${step.time ? `<small class="text-muted">${formatDateTime(step.time)}</small>` : ''}
                </div>
            `).join('');
        }

        function updateTaskLogs(task) {
            const taskLogs = document.getElementById('taskLogs');
            
            // 这里应该根据实际的日志数据来渲染
            // 暂时使用示例数据
            const logs = [
                { level: 'INFO', message: '任务创建成功', time: task.createdTime },
                { level: 'INFO', message: '任务开始执行', time: task.updatedTime }
            ];
            
            taskLogs.innerHTML = logs.map(log => `
                <div class="log-item ${log.level.toLowerCase()}">
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold">${log.level}</span>
                        <small class="text-muted">${formatDateTime(log.time)}</small>
                    </div>
                    <div>${log.message}</div>
                </div>
            `).join('');
        }

        function getStepStatusBadgeClass(status) {
            const statusConfig = {
                'PENDING': 'bg-secondary',
                'PROCESSING': 'bg-info',
                'COMPLETED': 'bg-success',
                'FAILED': 'bg-danger'
            };
            return statusConfig[status] || 'bg-secondary';
        }

        function getStepStatusText(status) {
            const statusConfig = {
                'PENDING': '待执行',
                'PROCESSING': '执行中',
                'COMPLETED': '已完成',
                'FAILED': '失败'
            };
            return statusConfig[status] || status;
        }

        function executeTask(taskId) {
            fetch(getContextPath() + `/api/tasks/${taskId}/execute`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('任务已提交执行', 'success');
                    setTimeout(loadTaskDetail, 1000);
                } else {
                    showToast('执行任务失败: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error executing task:', error);
                showToast('执行任务异常', 'danger');
            });
        }

        function retryTask(taskId) {
            fetch(getContextPath() + `/api/tasks/${taskId}/retry`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('任务重试已提交', 'success');
                    setTimeout(loadTaskDetail, 1000);
                } else {
                    showToast('重试任务失败: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error retrying task:', error);
                showToast('重试任务异常', 'danger');
            });
        }

        function pauseTask(taskId) {
            fetch(getContextPath() + `/api/tasks/${taskId}/pause`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('任务已暂停', 'success');
                    setTimeout(loadTaskDetail, 1000);
                } else {
                    showToast('暂停任务失败: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error pausing task:', error);
                showToast('暂停任务异常', 'danger');
            });
        }

        function resumeTask(taskId) {
            fetch(getContextPath() + `/api/tasks/${taskId}/execute`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('任务已恢复执行', 'success');
                    setTimeout(loadTaskDetail, 1000);
                } else {
                    showToast('恢复任务失败: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error resuming task:', error);
                showToast('恢复任务异常', 'danger');
            });
        }

        function cancelTask(taskId) {
            if (confirm('确定要取消这个任务吗？')) {
                fetch(getContextPath() + `/api/tasks/${taskId}/cancel`, {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        showToast('任务已取消', 'success');
                        setTimeout(loadTaskDetail, 1000);
                    } else {
                        showToast('取消任务失败: ' + data.message, 'danger');
                    }
                })
                .catch(error => {
                    console.error('Error cancelling task:', error);
                    showToast('取消任务异常', 'danger');
                });
            }
        }

        function deleteTask(taskId) {
            if (confirm('确定要删除这个任务吗？此操作不可恢复！')) {
                fetch(getContextPath() + `/api/tasks/${taskId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        showToast('任务已删除', 'success');
                        setTimeout(() => {
                            window.location.href = '/tasks';
                        }, 1000);
                    } else {
                        showToast('删除任务失败: ' + data.message, 'danger');
                    }
                })
                .catch(error => {
                    console.error('Error deleting task:', error);
                    showToast('删除任务异常', 'danger');
                });
            }
        }

        function startAutoRefresh() {
            // 每5秒自动刷新一次
            refreshInterval = setInterval(() => {
                loadTaskDetail();
            }, 5000);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function adjustAutoRefresh(status) {
            // 对于已完成或失败的任务，停止自动刷新
            if (status === 'COMPLETED' || status === 'FAILED' || status === 'CANCELLED') {
                stopAutoRefresh();
            }
        }

        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '-';
            
            const date = new Date(dateTimeStr);
            return date.toLocaleString('zh-CN');
        }

        function showToast(message, type = 'info') {
            let toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.id = 'toastContainer';
                toastContainer.className = 'toast-container position-fixed bottom-0 end-0 p-3';
                document.body.appendChild(toastContainer);
            }
            
            const toastId = 'toast-' + Date.now();
            const toastHtml = `
                <div id="${toastId}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto">系统提示</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        ${message}
                    </div>
                </div>
            `;
            
            toastContainer.insertAdjacentHTML('beforeend', toastHtml);
            
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement);
            toast.show();
            
            toastElement.addEventListener('hidden.bs.toast', function() {
                toastElement.remove();
            });
        }

        // 页面卸载时停止自动刷新
        window.addEventListener('beforeunload', function() {
            stopAutoRefresh();
        });
    </script>
</body>
</html>
