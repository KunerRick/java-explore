# 任务处理器链配置
task-handlers:
  # 视频评分任务处理器链
  VIDEO_SCORING:
    handlers:
      - CheckSubtitleHandler
      - ExtractSubtitleHandler
      - VideoScoreHandler
    description: "视频评分任务处理链"
  
  # 可以预定义其他任务类型
  TEXT_PROCESS:
    handlers:
      - TextValidationHandler
      - TextAnalysisHandler
    description: "文本处理任务链"
  
  IMAGE_PROCESS:
    handlers:
      - ImageValidationHandler
      - ImageAnalysisHandler
      - ImageReportHandler
    description: "图像处理任务链"

# 调试配置
debug:
  print-all-beans: false
  print-handler-beans: true