<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务列表 - 异步任务框架</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .nav-link {
            border-radius: 10px;
        }
        .nav-link.active {
            background-color: #0d6efd !important;
            border-radius: 10px;
        }
        .status-badge {
            font-size: 0.85em;
            padding: 0.35em 0.65em;
        }
        .pagination {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-gear-fill me-2"></i>异步任务框架
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">首页</a>
                <a class="nav-link active" th:href="@{/tasks}">任务列表</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>任务列表</h2>
                    <div>
                        <button id="refreshBtn" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-clockwise me-1"></i>刷新
                        </button>
                        <button id="createTaskBtn" class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                            <i class="bi bi-plus-circle me-1"></i>创建任务
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">筛选条件</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label for="taskTypeFilter" class="form-label">任务类型</label>
                                <select class="form-select" id="taskTypeFilter">
                                    <option value="">全部</option>
                                    <option value="VIDEO_SCORING">视频评分</option>
                                </select>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="statusFilter" class="form-label">状态</label>
                                <select class="form-select" id="statusFilter">
                                    <option value="">全部</option>
                                    <option value="PENDING">待处理</option>
                                    <option value="PROCESSING">处理中</option>
                                    <option value="COMPLETED">已完成</option>
                                    <option value="FAILED">失败</option>
                                    <option value="PAUSED">暂停</option>
                                </select>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="creatorFilter" class="form-label">创建人</label>
                                <input type="text" class="form-control" id="creatorFilter" placeholder="输入创建人">
                            </div>
                            <div class="col-md-3 mb-3 d-flex align-items-end">
                                <button id="filterBtn" class="btn btn-primary w-100">
                                    <i class="bi bi-funnel me-1"></i>筛选
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">任务列表</h5>
                        <div class="d-flex align-items-center">
                            <span class="me-3 text-muted" id="totalCount">共 0 条记录</span>
                            <div class="btn-group" role="group">
                                <button class="btn btn-outline-secondary" id="prevPage" disabled>
                                    <i class="bi bi-chevron-left"></i>
                                </button>
                                <span class="btn btn-outline-secondary disabled" id="currentPage">1</span>
                                <button class="btn btn-outline-secondary" id="nextPage" disabled>
                                    <i class="bi bi-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>任务ID</th>
                                        <th>任务名称</th>
                                        <th>任务类型</th>
                                        <th>状态</th>
                                        <th>进度</th>
                                        <th>创建人</th>
                                        <th>创建时间</th>
                                        <th>更新时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="tasksTable">
                                    <tr>
                                        <td colspan="9" class="text-center">正在加载...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建任务模态框 -->
    <div class="modal fade" id="createTaskModal" tabindex="-1" aria-labelledby="createTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createTaskModalLabel">创建任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createTaskForm">
                        <div class="mb-3">
                            <label for="createTaskType" class="form-label">任务类型</label>
                            <select class="form-select" id="createTaskType" required>
                                <option value="">请选择任务类型</option>
                                <option value="VIDEO_SCORING">视频评分</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="createVideoId" class="form-label">视频ID</label>
                            <input type="text" class="form-control" id="createVideoId" placeholder="请输入视频ID">
                        </div>
                        <div class="mb-3">
                            <label for="createTaskName" class="form-label">任务名称</label>
                            <input type="text" class="form-control" id="createTaskName" required>
                        </div>
                        <div class="mb-3">
                            <label for="createCreator" class="form-label">创建人</label>
                            <input type="text" class="form-control" id="createCreator" required>
                        </div>
                        <div class="mb-3">
                            <label for="createPriority" class="form-label">优先级 (1-10)</label>
                            <input type="number" class="form-control" id="createPriority" min="1" max="10" value="5" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="submitCreateTask">创建任务</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 获取上下文路径
        function getContextPath() {
            return window.location.pathname.substring(0, window.location.pathname.indexOf("/",2));
        }
        
        let currentPage = 0;
        let pageSize = 10;
        let totalPages = 0;
        let totalElements = 0;

        document.addEventListener('DOMContentLoaded', function() {
            loadTasks();

            // 刷新按钮
            document.getElementById('refreshBtn').addEventListener('click', function() {
                loadTasks();
            });

            // 筛选按钮
            document.getElementById('filterBtn').addEventListener('click', function() {
                currentPage = 0;
                loadTasks();
            });

            // 分页按钮
            document.getElementById('prevPage').addEventListener('click', function() {
                if (currentPage > 0) {
                    currentPage--;
                    loadTasks();
                }
            });

            document.getElementById('nextPage').addEventListener('click', function() {
                if (currentPage < totalPages - 1) {
                    currentPage++;
                    loadTasks();
                }
            });

            // 创建任务按钮
            document.getElementById('submitCreateTask').addEventListener('click', function() {
                createTask();
            });
        });

        function loadTasks() {
            const taskType = document.getElementById('taskTypeFilter').value;
            const status = document.getElementById('statusFilter').value;
            const creator = document.getElementById('creatorFilter').value;

            let url = getContextPath() + `/api/tasks?page=${currentPage}&size=${pageSize}&sortBy=createdTime&sortDir=desc`;
            
            if (taskType) url += `&taskType=${taskType}`;
            if (status) url += `&status=${status}`;
            if (creator) url += `&creator=${creator}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        updateTasksTable(data.data);
                    } else {
                        showToast('加载任务列表失败: ' + data.message, 'danger');
                    }
                })
                .catch(error => {
                    console.error('Error loading tasks:', error);
                    showToast('加载任务列表异常', 'danger');
                });
        }

        function updateTasksTable(pageData) {
            const tasks = pageData.content || [];
            totalPages = pageData.totalPages || 0;
            totalElements = pageData.totalElements || 0;

            const tbody = document.getElementById('tasksTable');
            
            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">暂无任务</td></tr>';
            } else {
                tbody.innerHTML = tasks.map(task => `
                    <tr>
                        <td>${task.taskId}</td>
                        <td>${task.taskName}</td>
                        <td>${task.taskType}</td>
                        <td>${getStatusBadge(task.status)}</td>
                        <td>
                            <div class="progress" style="height: 20px;">
                                <div class="progress-bar" role="progressbar" style="width: ${task.progress}%;" 
                                     aria-valuenow="${task.progress}" aria-valuemin="0" aria-valuemax="100">
                                    ${task.progress}%
                                </div>
                            </div>
                        </td>
                        <td>${task.creator}</td>
                        <td>${formatDateTime(task.createdTime)}</td>
                        <td>${formatDateTime(task.updatedTime)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="viewTask('${task.taskId}')">
                                <i class="bi bi-eye"></i>
                            </button>
                            ${getActionButtons(task)}
                        </td>
                    </tr>
                `).join('');
            }

            // 更新分页信息
            document.getElementById('totalCount').textContent = `共 ${totalElements} 条记录`;
            document.getElementById('currentPage').textContent = currentPage + 1;
            document.getElementById('prevPage').disabled = currentPage === 0;
            document.getElementById('nextPage').disabled = currentPage >= totalPages - 1;
        }

        function getStatusBadge(status) {
            const statusConfig = {
                'PENDING': { text: '待处理', class: 'bg-warning' },
                'PROCESSING': { text: '处理中', class: 'bg-info' },
                'COMPLETED': { text: '已完成', class: 'bg-success' },
                'FAILED': { text: '失败', class: 'bg-danger' },
                'PAUSED': { text: '暂停', class: 'bg-secondary' }
            };
            
            const config = statusConfig[status] || { text: status, class: 'bg-secondary' };
            return `<span class="badge ${config.class} status-badge">${config.text}</span>`;
        }

        function getActionButtons(task) {
            let buttons = '';
            
            if (task.status === 'PENDING') {
                buttons += `<button class="btn btn-sm btn-outline-success me-1" onclick="executeTask('${task.taskId}')">
                    <i class="bi bi-play-fill"></i>
                </button>`;
            }
            
            if (task.status === 'FAILED') {
                buttons += `<button class="btn btn-sm btn-outline-warning me-1" onclick="retryTask('${task.taskId}')">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>`;
            }
            
            if (task.status === 'PROCESSING') {
                buttons += `<button class="btn btn-sm btn-outline-warning me-1" onclick="pauseTask('${task.taskId}')">
                    <i class="bi bi-pause-fill"></i>
                </button>`;
            }
            
            if (task.status === 'PROCESSING' || task.status === 'PENDING') {
                buttons += `<button class="btn btn-sm btn-outline-danger me-1" onclick="cancelTask('${task.taskId}')">
                    <i class="bi bi-x-circle"></i>
                </button>`;
            }
            
            return buttons;
        }

        function createTask() {
            const taskType = document.getElementById('createTaskType').value;
            const videoId = document.getElementById('createVideoId').value;
            const taskName = document.getElementById('createTaskName').value;
            const creator = document.getElementById('createCreator').value;
            const priority = document.getElementById('createPriority').value;

            if (!taskType) {
                showToast('请选择任务类型', 'warning');
                return;
            }

            if (taskType === 'VIDEO_SCORING' && !videoId) {
                showToast('请输入视频ID', 'warning');
                return;
            }

            let url = getContextPath() + '/api/tasks/video-scoring';
            const params = new URLSearchParams({
                videoId: videoId,
                taskName: taskName,
                creator: creator,
                priority: priority
            });

            fetch(getContextPath() + url + '?' + params.toString(), {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('任务创建成功', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('createTaskModal')).hide();
                    document.getElementById('createTaskForm').reset();
                    loadTasks();
                } else {
                    showToast('创建任务失败: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error creating task:', error);
                showToast('创建任务异常', 'danger');
            });
        }

        function viewTask(taskId) {
            window.location.href = getContextPath() + '/task-detail?taskId=' + taskId;
        }

        function executeTask(taskId) {
            fetch(getContextPath() + `/api/tasks/${taskId}/execute`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('任务已提交执行', 'success');
                    setTimeout(loadTasks, 1000);
                } else {
                    showToast('执行任务失败: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error executing task:', error);
                showToast('执行任务异常', 'danger');
            });
        }

        function retryTask(taskId) {
            fetch(getContextPath() + `/api/tasks/${taskId}/retry`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('任务重试已提交', 'success');
                    setTimeout(loadTasks, 1000);
                } else {
                    showToast('重试任务失败: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error retrying task:', error);
                showToast('重试任务异常', 'danger');
            });
        }

        function pauseTask(taskId) {
            fetch(getContextPath() + `/api/tasks/${taskId}/pause`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('任务已暂停', 'success');
                    setTimeout(loadTasks, 1000);
                } else {
                    showToast('暂停任务失败: ' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error pausing task:', error);
                showToast('暂停任务异常', 'danger');
            });
        }

        function cancelTask(taskId) {
            if (confirm('确定要取消这个任务吗？')) {
                fetch(getContextPath() + `/api/tasks/${taskId}/cancel`, {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        showToast('任务已取消', 'success');
                        setTimeout(loadTasks, 1000);
                    } else {
                        showToast('取消任务失败: ' + data.message, 'danger');
                    }
                })
                .catch(error => {
                    console.error('Error cancelling task:', error);
                    showToast('取消任务异常', 'danger');
                });
            }
        }

        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '-';
            
            const date = new Date(dateTimeStr);
            return date.toLocaleString('zh-CN');
        }

        function showToast(message, type = 'info') {
            let toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.id = 'toastContainer';
                toastContainer.className = 'toast-container position-fixed bottom-0 end-0 p-3';
                document.body.appendChild(toastContainer);
            }
            
            const toastId = 'toast-' + Date.now();
            const toastHtml = `
                <div id="${toastId}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto">系统提示</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        ${message}
                    </div>
                </div>
            `;
            
            toastContainer.insertAdjacentHTML('beforeend', toastHtml);
            
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement);
            toast.show();
            
            toastElement.addEventListener('hidden.bs.toast', function() {
                toastElement.remove();
            });
        }
    </script>
</body>
</html>
