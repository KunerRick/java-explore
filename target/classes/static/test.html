<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异步任务管理系统测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .test-section {
            margin-bottom: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border-left: 5px solid #4facfe;
        }

        .test-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }

        .test-section h2::before {
            content: "🔧";
            margin-right: 10px;
            font-size: 1.3rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #e9ecef;
        }

        .result.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .result.info {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #4facfe;
        }

        .stat-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e9ecef;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .input-group input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>异步任务管理系统</h1>
            <p>责任链模式测试与验证平台</p>
        </div>

        <div class="content">
            <!-- 创建任务测试 -->
            <div class="test-section">
                <h2>创建任务测试</h2>
                <div class="input-group">
                    <input type="text" id="createTaskId" placeholder="输入任务ID (例如: TASK_001)" value="TASK_001">
                    <button class="btn btn-primary" onclick="testCreateTask()">
                        <span>🚀</span> 创建任务
                    </button>
                </div>
                <div id="createResult" class="result" style="display: none;"></div>
            </div>

            <!-- 执行任务测试 -->
            <div class="test-section">
                <h2>执行任务测试</h2>
                <div class="input-group">
                    <input type="text" id="executeTaskId" placeholder="输入任务ID" value="TASK_001">
                    <button class="btn btn-success" onclick="testExecuteTask()">
                        <span>▶️</span> 执行任务
                    </button>
                </div>
                <div id="executeResult" class="result" style="display: none;"></div>
            </div>

            <!-- 查看任务状态 -->
            <div class="test-section">
                <h2>查看任务状态</h2>
                <div class="input-group">
                    <input type="text" id="statusTaskId" placeholder="输入任务ID" value="TASK_001">
                    <button class="btn btn-info" onclick="testGetTaskStatus()">
                        <span>📊</span> 查看状态
                    </button>
                </div>
                <div id="statusResult" class="result" style="display: none;"></div>
            </div>

            <!-- 快速测试组合 -->
            <div class="test-section">
                <h2>快速流程测试</h2>
                <div class="input-group">
                    <input type="text" id="quickTaskId" placeholder="输入任务ID" value="QUICK_TASK_001">
                    <button class="btn btn-primary" onclick="quickTest()">
                        <span>⚡</span> 一键测试完整流程
                    </button>
                </div>
                <div id="quickResult" class="result" style="display: none;"></div>
            </div>

            <!-- 统计信息 -->
            <div class="stats">
                <div class="stat-card">
                    <h3>📋 责任链信息</h3>
                    <p>VIDEO_SCORING 类型的任务包含多个处理器，通过责任链模式依次处理视频评分任务。</p>
                </div>
                <div class="stat-card">
                    <h3>🔄 异步执行</h3>
                    <p>支持异步任务执行，提高系统并发处理能力，避免阻塞主线程。</p>
                </div>
                <div class="stat-card">
                    <h3>🎯 任务状态管理</h3>
                    <p>实时跟踪任务状态，包括待执行、执行中、已完成、失败等状态。</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 异步任务管理系统 - 基于Spring Boot + 责任链模式</p>
        </div>
    </div>

    <script>
        // API 基础路径
        const API_BASE = '/api/test';

        // 显示结果
        function showResult(elementId, data, type = 'info') {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `result ${type}`;
            element.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
        }

        // 创建任务
        async function testCreateTask() {
            const taskId = document.getElementById('createTaskId').value || 'TASK_001';
            const btn = event.target;
            
            // 显示加载状态
            btn.innerHTML = '<span class="loading"></span> 创建中...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/create/${taskId}`);
                const data = await response.json();
                
                if (data.success) {
                    showResult('createResult', data, 'success');
                    // 自动填充其他输入框
                    document.getElementById('executeTaskId').value = data.taskId;
                    document.getElementById('statusTaskId').value = data.taskId;
                } else {
                    showResult('createResult', data, 'error');
                }
            } catch (error) {
                showResult('createResult', `请求失败: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = '<span>🚀</span> 创建任务';
                btn.disabled = false;
            }
        }

        // 执行任务
        async function testExecuteTask() {
            const taskId = document.getElementById('executeTaskId').value || 'TASK_001';
            const btn = event.target;
            
            btn.innerHTML = '<span class="loading"></span> 执行中...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/execute/${taskId}`);
                const data = await response.json();
                
                if (data.success) {
                    showResult('executeResult', data, 'success');
                } else {
                    showResult('executeResult', data, 'error');
                }
            } catch (error) {
                showResult('executeResult', `请求失败: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = '<span>▶️</span> 执行任务';
                btn.disabled = false;
            }
        }

        // 查看任务状态
        async function testGetTaskStatus() {
            const taskId = document.getElementById('statusTaskId').value || 'TASK_001';
            const btn = event.target;
            
            btn.innerHTML = '<span class="loading"></span> 查询中...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await response.json();
                
                if (data.success) {
                    showResult('statusResult', data, 'success');
                } else {
                    showResult('statusResult', data, 'error');
                }
            } catch (error) {
                showResult('statusResult', `请求失败: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = '<span>📊</span> 查看状态';
                btn.disabled = false;
            }
        }

        // 快速测试完整流程
        async function quickTest() {
            const taskId = document.getElementById('quickTaskId').value || 'QUICK_TASK_001';
            const btn = event.target;
            const resultElement = document.getElementById('quickResult');
            
            btn.innerHTML = '<span class="loading"></span> 测试中...';
            btn.disabled = true;
            
            resultElement.style.display = 'block';
            resultElement.className = 'result info';
            resultElement.textContent = '开始快速测试流程...\n';

            try {
                // 步骤1: 创建任务
                resultElement.textContent += '\n📋 步骤1: 创建任务';
                const createResponse = await fetch(`${API_BASE}/create/${taskId}`);
                const createData = await createResponse.json();
                
                if (createData.success) {
                    resultElement.textContent += '\n✅ 任务创建成功: ' + createData.taskId;
                    resultElement.textContent += '\n📝 处理器链: ' + JSON.stringify(createData.handlerNames);
                } else {
                    throw new Error('任务创建失败: ' + createData.message);
                }

                // 步骤2: 执行任务
                resultElement.textContent += '\n\n⚡ 步骤2: 执行任务';
                const executeResponse = await fetch(`${API_BASE}/execute/${taskId}`);
                const executeData = await executeResponse.json();
                
                if (executeData.success) {
                    resultElement.textContent += '\n✅ 任务提交执行成功';
                } else {
                    throw new Error('任务执行失败: ' + executeData.message);
                }

                // 等待一段时间后检查状态
                resultElement.textContent += '\n\n⏳ 等待2秒后检查任务状态...';
                await new Promise(resolve => setTimeout(resolve, 2000));

                // 步骤3: 查看任务状态
                resultElement.textContent += '\n\n📊 步骤3: 查看任务状态';
                const statusResponse = await fetch(`${API_BASE}/status/${taskId}`);
                const statusData = await statusResponse.json();
                
                if (statusData.success) {
                    resultElement.textContent += '\n✅ 任务状态查询成功';
                    resultElement.textContent += '\n📋 任务详情: ' + JSON.stringify(statusData.task, null, 2);
                } else {
                    resultElement.textContent += '\n❌ 任务状态查询失败: ' + statusData.message;
                }

                resultElement.textContent += '\n\n🎉 快速测试流程完成！';
                resultElement.className = 'result success';

            } catch (error) {
                resultElement.textContent += '\n\n❌ 测试失败: ' + error.message;
                resultElement.className = 'result error';
            } finally {
                btn.innerHTML = '<span>⚡</span> 一键测试完整流程';
                btn.disabled = false;
            }
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 为所有输入框添加回车键支持
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const button = this.parentElement.querySelector('button');
                        if (button) {
                            button.click();
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
